# アカウント設定:投稿時間・頻度・トーン・スケジューラ運用パラメータ
# 実際のIGアカウントID/トークンは.envで管理し、ここには含めない

timezone: "Asia/Tokyo"

posting:
  feed_per_day: 1
  feed_times: ["19:00"]        # 分析結果に応じて調整可
  story_days: ["Mon", "Wed", "Fri"]
  story_time: "20:00"

rate_limit:
  max_posts_per_24h: 25        # Graph APIのコンテンツ公開上限

retry:
  max_attempts: 3
  backoff_base_seconds: 60     # 指数バックオフの基準値(60, 120, 240...)

scheduler:
  poll_interval_minutes: 5     # cronの実行間隔と一致させる
